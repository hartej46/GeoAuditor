version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoauditor-app
    ports:
      - "3000:3000"
    env_file:
      - server/.env
    environment:
      - PORT=3000
      - SERPAPI_KEY=${SERPAPI_KEY:-your_serpapi_key_here}
      - DATABASE_URL=postgres://postgres:postgres@db:5432/geoauditor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: geoauditor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geoauditor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geoauditor"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
